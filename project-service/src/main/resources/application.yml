server:
  port: ${PROJECT_SERVICE_PORT:8082}

spring:
  application:
    name: project-service

  datasource:
    url: jdbc:postgresql://${PROJECT_DB_HOST:localhost}:${PROJECT_DB_PORT:5434}/${PROJECT_DB_NAME}
    username: ${PROJECT_DB_USER}
    password: ${PROJECT_DB_PASS}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:600000}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    virtual-host: ${RABBITMQ_VHOST:/}

  jpa:
    hibernate:
      ddl-auto: ${PROJECT_SERVICE_JPA_DDL_AUTO:validate}

app:
  internal:
    api-key: ${INTERNAL_API_KEY:dev-internal-key}
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8081}
  task-service:
    url: ${TASK_SERVICE_URL:http://localhost:8083}
  poker-service:
    url: ${POKER_SERVICE_URL:http://localhost:8084}
  notifications:
    exchange: ${NOTIFICATIONS_EXCHANGE:agileflow.notifications}
    routing-key: ${NOTIFICATIONS_ROUTING_KEY:user-service.notification}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:agileflow-user-service}
    audience: ${JWT_AUDIENCE:agileflow-api}
