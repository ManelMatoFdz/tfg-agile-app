server:
  port: ${TASK_SERVICE_PORT:8083}

spring:
  application:
    name: task-service

  datasource:
    url: jdbc:postgresql://${TASK_DB_HOST:localhost}:${TASK_DB_PORT:5435}/${TASK_DB_NAME:taskdb}
    username: ${TASK_DB_USER:task}
    password: ${TASK_DB_PASS:task}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:600000}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}

  jpa:
    hibernate:
      ddl-auto: ${TASK_SERVICE_JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  internal:
    api-key: ${INTERNAL_API_KEY:dev-internal-key}
  project-service:
    url: ${PROJECT_SERVICE_URL:http://localhost:8082}
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8081}
  git:
    # URL publica desde la que GitHub alcanza este servicio
    webhook-base-url: ${GIT_WEBHOOK_BASE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

security:
  jwt:
    secret: ${JWT_SECRET:replace-with-a-long-random-secret-min-32-bytes}
    issuer: ${JWT_ISSUER:agileflow-user-service}
    audience: ${JWT_AUDIENCE:agileflow-api}
